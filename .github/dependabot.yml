# Weekly dependency updates, grouped per ecosystem. Security updates (enable
# Dependabot alerts and security updates in the repository settings) arrive
# independently and at once. CI runs tests and govulncheck on every PR.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    # Freshly published versions only after a week (supply-chain attacks).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'build(deps)'
    groups:
      terraform-plugin:
        patterns: ['github.com/hashicorp/terraform-plugin-*']
      golang-x:
        patterns: ['golang.org/x/*']

  - package-ecosystem: github-actions # SHA-pinned actions with version comment
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
