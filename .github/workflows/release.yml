name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Gate before anything is built or signed: the tag points at a commit on
  # main, the toolchain is the one go.mod pins, and tests, vet and
  # govulncheck pass on exactly that commit.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go toolchain is the one in go.mod
        run: |
          want="$(sed -n 's/^toolchain //p' go.mod)"
          have="$(go env GOVERSION)"
          echo "go.mod toolchain: ${want:-none}, in use: ${have}"
          test -n "${want}" && test "${want}" = "${have}"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    # The release environment holds GPG_PRIVATE_KEY / GPG_PASSPHRASE and
    # requires a reviewer before the job starts; v* tags are protected by a
    # tag ruleset. Both are repository settings — see README, "Releases".
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build provenance (Sigstore)
      attestations: write # store the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache restored into a release build: a poisoned cache from
          # another workflow run must not reach the signed binaries.
          cache: false
      - name: Go toolchain is the one in go.mod
        run: |
          want="$(sed -n 's/^toolchain //p' go.mod)"
          have="$(go env GOVERSION)"
          echo "go.mod toolchain: ${want:-none}, in use: ${have}"
          test -n "${want}" && test "${want}" = "${have}"
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*_SHA256SUMS
